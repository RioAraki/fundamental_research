# L0 · 界定层:我到底在给什么定价(SHFE CU)
# 方法论(见 METHODOLOGY.md §L0):基本面研究的第一性问题不是"供需如何",
# 而是"我研究的那个东西,和我交易的那个合约,中间隔着什么"。
# L0 缺失会导致系统性错位——用全球逻辑推本地标的、用美元逻辑推人民币标的。
# 本文件不参与 QPN 传播,它的作用是:
#   ① 生成"必须存在的节点"清单(见 requires_node),供 check_coverage 校验;
#   ② 提醒每一条从 LME/全球指标到 SHFE 的推理,中间有哪些转换环节。

meta:
  commodity: 铜(SHFE CU)
  version: "0.1"
  updated: "2026-08-16"

scope:
  # ── 标的物 ──
  - id: 交易标的
    value: "上期所阴极铜期货 CU;GB/T 467 A级铜(Cu≥99.95%);5 吨/手"
    why: "全球精铜过剩 ≠ 可交割铜过剩。品质与品牌不达标的铜再多也进不了仓单。"
    requires_node: null
    gap_note: "当前图谱直接用「全球精铜供给」推「SHFE铜价格」,跳过了可交割性这一层"

  - id: 交割品牌
    value: "上期所注册品牌名录(国产 + 部分进口注册品牌);非注册品牌不可交割"
    why: "品牌注册/注销是行政动作,可以在供需完全不变的情况下改变可交割量,进而改变月差与逼仓风险。"
    requires_node: 可交割资源量
    gap_note: "图中缺失。2024.5 沪铜逼空期,可交割资源紧张是关键变量之一"

  - id: 交割地
    value: "上海、江苏、浙江、广东等指定交割仓库"
    why: "保税区库存 ≠ 交易所库存,中间隔着关税、增值税、清关时长与配额。跨区搬库有成本和时滞。"
    requires_node: 保税区库存
    gap_note: "图中缺失。「洋山铜溢价」已在边 evidence 中被引用,却没有对应节点"

  - id: 计价币种与税
    value: "人民币计价 · 含 13% 增值税 · 进口另有关税与滞纳成本"
    why: "汇率是硬编码在 SHFE 价格里的转换因子,不是「宏观扰动之一」。美元指数→LME→SHFE 的传导必须经过人民币汇率。"
    requires_node: 人民币汇率
    gap_note: "★ 图中缺失,但边「美元指数→LME铜价格」的 rationale 已明确写出汇率对冲机制——机制写在文字里、没建成节点,是典型的结构盲点"

  - id: 计价基准
    value: "盘面(主力连续) / 现货升贴水(上海有色 1# 电解铜) / 长单(TC 长协、加工费)"
    why: "产业真实成交价与盘面不是一回事;冶炼厂的收入锚是长协 TC,下游的成本锚是升贴水后的现货价。"
    requires_node: 现货升贴水
    gap_note: "图中缺失。现货升贴水是日频最贴近真实松紧的指标,比周度社会库存更灵敏"

  - id: 合约节律
    value: "主力按月序滚动(近月化);每月中下旬移仓;交割月前持仓限制"
    why: "月差结构与移仓行为会制造与基本面无关的价格波动;回测与信号生成必须处理主力切换。"
    requires_node: null
    gap_note: "不影响基本面判断,但影响信号落地"

# ── 定价链的显式转换环节 ──
# 任何一条"全球/LME 层面的结论"要变成"沪铜的结论",必须显式穿过下面每一环。
# 用途:review 一份研究结论时,逐环自问"这一环我考虑了吗"。
translation_chain:
  - step: 全球精铜平衡
    to: LME 价格
    via: [全球显性库存, LME升水结构, 基金净持仓]
    status: 图中已建模
  - step: LME 价格
    to: 进口完税成本
    via: [人民币汇率, 关税与增值税, 到岸费用与海运费]
    status: ★ 完全缺失 —— 这是 L0 最大的断点
  - step: 进口完税成本
    to: 进口盈亏窗口
    via: [沪伦比值, 洋山溢价]
    status: 部分(沪伦比值已建,洋山溢价缺)
  - step: 进口盈亏窗口
    to: 实际进口流入
    via: [进口流入, 清关与配额摩擦, 在途时滞]
    status: 部分(进口流入已建,摩擦与时滞缺)
  - step: 中国显性库存
    to: SHFE 价格
    via: [中国社会库存, 保税区库存, SHFE仓单, 现货升贴水, 可交割资源量]
    status: 部分(仅中国社会库存已建)
