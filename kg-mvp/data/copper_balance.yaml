# L1 · 定性平衡表科目表(SHFE CU)
# 方法论(见 METHODOLOGY.md §L1):
#   这不是一张要填数字的表,而是一份**先验完整的科目清单**。
#   定性研究不需要知道"缺口 15 万吨",但需要知道"影响价格的东西必须落在某个科目上"。
#   闭合性由此而来:科目空间是封闭的 → 图谱里没有覆盖到的科目 = 结构盲点 = 可自动检出。
#
# 用法:
#   node: <copper.yaml 中的节点 id>   → 该科目已建模
#   node: null                        → ★ 缺口:这个科目在图谱里不存在
#   check_coverage.py 会把 null 项、以及"有节点但入度为 0"的项列成缺口报告。
#
# 科目表的来源:券商/资讯商铜平衡表科目的并集(SMM、ICSG 口径)+ 交割与物流环节。
# 修订原则:发现新的价格驱动却找不到对应科目时,先问"是不是该加科目",再问"是不是该加节点"。

meta:
  commodity: 铜(SHFE CU)
  version: "0.1"
  updated: "2026-08-16"
  qualitative: true   # 本表只做定性配平(方向自洽),不承诺数量精度

# ══════════════════════════════════════════════════
# 表一 · 铜精矿平衡表(中国口径为主,全球为背景)
# 恒等式:期初精矿库存 + 矿产量 + 精矿进口 = 冶炼投料 + 精矿出口 + 期末精矿库存
# 松紧的价格表达:TC/RC(矿紧 → TC 跌)
# ══════════════════════════════════════════════════
tables:
  - id: 铜精矿
    identity: "期初库存 + 矿产量 + 进口 = 冶炼投料 + 出口 + 期末库存"
    tension_price: TC/RC加工费
    accounts:
      - id: 全球矿产量
        side: 供给
        node: 铜精矿供给
        must: true
        note: "全球约 2300 万吨;头部矿山单体占 3-6%,事件驱动主要落在这里"
        signals: {data: ["ICSG 月度矿产量", "Cochilco", "头部矿企季报"]}

      - id: 精矿进口量
        side: 供给
        node: null
        must: true
        gap: "★ 缺口:中国精矿对外依存度 77%+,却没有独立科目。矿端扰动要影响中国冶炼,必须经过这一环"
        signals: {data: ["海关铜矿砂及其精矿进口(月)"]}

      - id: 精矿港口库存
        side: 库存
        node: null
        must: false
        gap: "缺口:港口精矿库存是冶炼厂原料缓冲,决定矿端扰动多久才传到产量上(缓冲越厚、时滞越长)"
        signals: {data: ["SMM 主要港口铜精矿库存(周)"]}

      - id: 冶炼投料需求
        side: 需求
        node: null
        must: true
        gap: "★ 缺口:TC 是供需两侧共同决定的,图中只建了供给侧(铜精矿供给→TC)与产能侧(冶炼产能扩张→TC),缺'投料需求'这个中介科目"
        signals: {data: ["SMM 冶炼厂开工率与投料调研"]}

      - id: 精矿出口量
        side: 需求
        node: null
        must: false
        note: "中国基本不出口精矿;资源国出口禁令(印尼、刚果金)在此体现"

  # ══════════════════════════════════════════════════
  # 表二 · 精炼铜平衡表(中国口径)—— 核心表
  # 恒等式:期初库存 + 精炼产量 + 净进口 + 废铜直接利用 = 表观消费 + 铜材出口 + 期末库存
  # 注意废铜的双重身份:①作冷料进冶炼(计入精炼产量)②被下游直接使用(替代精铜消费)
  # ══════════════════════════════════════════════════
  - id: 精炼铜·中国
    identity: "期初库存 + 精炼产量 + 净进口 + 废铜直接利用 = 表观消费 + 铜材出口 + 期末库存"
    tension_price: 现货升贴水
    accounts:
      - id: 中国精炼产量
        side: 供给
        node: 中国精铜产量
        must: true
        note: "2024 年 1364 万吨,占全球 49%"
        signals: {data: ["统计局精炼铜产量(月中)", "SMM 冶炼厂月度调研"]}

      - id: 精铜进口量
        side: 供给
        node: 进口流入
        must: true
        note: "已建模,但当前节点混合了'窗口开合'与'实际到货'两个含义"
        signals: {data: ["海关未锻轧铜及铜材进口(月)"]}

      - id: 精铜出口量
        side: 需求
        node: null
        must: true
        gap: "★ 缺口:中国精铜与铜材出口在内需疲弱时是重要泄压阀。缺这一项会导致'需求弱→必然累库'的错误推断(货其实出口了)"
        signals: {data: ["海关未锻轧铜及铜材出口(月)"]}

      - id: 废铜直接利用
        side: 供给
        node: 再生铜替代
        must: true
        note: "★ 分类修正:图中 type 标为「需求指标」,在平衡表口径下它是**供给替代项**。因果方向(压制精铜需求)不变,但科目归属应记在供给侧,否则会双重计数"
        signals: {data: ["SMM 再生铜杆开工率", "海关废铜进口(月)"]}

      - id: 中国表观消费
        side: 需求
        node: 中国终端铜需求
        must: true
        note: "表观消费 = 产量 + 净进口 − 显性库存变化;它与真实消费的差 = 隐性库存 = 残差(见 residual)"

      - id: 国储收储量
        side: 库存
        node: null
        must: false
        gap: "缺口:图中有根因「国储收抛储」,但没有'国储库存'这个存量科目。收储把现货从市场移到不可见池子里,存量本身是未来的潜在供给"
        signals: {data: ["国家粮食和物资储备局公告(不定期)"]}

  # ══════════════════════════════════════════════════
  # 表三 · 全球精炼铜平衡表(定价锚层)
  # ══════════════════════════════════════════════════
  - id: 精炼铜·全球
    identity: "全球精炼产量 + 全球废铜直接利用 = 全球消费 + 全球库存变化"
    tension_price: LME升水结构
    accounts:
      - id: 全球精炼产量
        side: 供给
        node: 全球精铜供给
        must: true
      - id: 海外消费
        side: 需求
        node: 海外终端铜需求
        must: true
      - id: 全球库存变化
        side: 库存
        node: 全球显性库存
        must: true
        note: "★ 结构问题:本节点与「中国社会库存」是包含关系(中国 ⊂ 全球),但图中两者平行且都直连价格,存在双重计数风险。应显式建立聚合边或拆分口径"

  # ══════════════════════════════════════════════════
  # 表四 · 终端消费拆分(残差诊断表)
  # 真实消费 = 各行业用铜之和;表观消费 − 真实消费 = 隐性库存变化
  # ══════════════════════════════════════════════════
  - id: 终端消费
    identity: "电力 + 空调制冷 + 交通 + 建筑 + 电子 + 机械 = 真实消费"
    accounts:
      - id: 电力电网用铜
        side: 需求
        node: 中国电网投资
        must: true
        note: "占中国铜消费 45%+,第一大项"
      - id: 空调制冷用铜
        side: 需求
        node: 家电产销出口
        must: true
        note: "铜管 80%+ 用于空调;排产领先 1-2 个月"
      - id: 交通运输用铜
        side: 需求
        node: 新能源车产销
        must: true
      - id: 建筑用铜
        side: 需求
        node: 地产竣工景气
        must: true
      - id: 新能源发电用铜
        side: 需求
        node: 光伏风电装机
        must: true
      - id: 电子与通信用铜
        side: 需求
        node: null
        must: false
        gap: "缺口:消费电子/PCB/通信设备用铜,量级中等但与出口周期相关"
      - id: 机械设备用铜
        side: 需求
        node: null
        must: false
        gap: "缺口:与制造业投资周期相关"
      - id: 数据中心用铜
        side: 需求
        node: 数据中心算力基建需求
        must: true
        note: "当前挂在海外需求下;国内 IDC 建设同样耗铜,口径需要明确"

# ══════════════════════════════════════════════════
# 库存五池 —— 加总校验的核心
# 约束:交易所 + 保税 + 社会/贸易商 + 厂内 + 在途 = 总库存
# 定性用法:若"总库存在降"但"交易所库存在涨",则必有某池在降。
#          说不出是哪一池 → 说明该池没有建模 → 结构盲点。
# ══════════════════════════════════════════════════
inventory_pools:
  - id: SHFE仓单
    visibility: 显性
    node: null
    must: true
    gap: "★ 缺口:上期所库存/仓单日频公布,是国内最显性的库存池,图中却没有独立节点(只有聚合的「中国社会库存」)"
    signals: {data: ["上期所每日库存与仓单"]}

  - id: LME库存
    visibility: 显性
    node: null
    must: true
    gap: "★ 缺口:图中只有「LME注销仓单占比」这个衍生指标,没有库存本体"
    signals: {data: ["LME 每日库存"]}

  - id: COMEX库存
    visibility: 显性
    node: COMEX库存水平
    must: true

  - id: 保税区库存
    visibility: 半显性
    node: null
    must: true
    gap: "★ 缺口:保税区库存是'已到中国但未清关'的铜,洋山溢价是它的价格信号。它决定了进口窗口打开后多快能到货。边 evidence 中已引用洋山溢价,却无节点"
    signals: {data: ["SMM 保税区库存(周)", "洋山铜溢价(日)"]}

  - id: 中国社会库存
    visibility: 显性
    node: 中国社会库存
    must: true
    note: "SMM 周一/周四发布"

  - id: 下游厂内库存
    visibility: 隐性
    node: null
    must: false
    gap: "缺口:下游原料库存天数决定'补库/去库'节奏。数据靠调研,定性可用'下游采购意愿'表达"
    signals: {data: ["SMM 下游企业原料库存天数(周/月)"]}

  - id: 在途库存
    visibility: 隐性
    node: null
    must: true
    gap: "★★ 缺口(物流):海运 30-45 天在途量 + 到港节奏。这是整张图完全没有物流环节的直接体现。进口窗口打开到实际累库之间的时滞,就藏在这一池里"
    signals: {data: ["船期跟踪/到港预报", "海关进口量与保税入库量的时间差"]}

  - id: 国储库存
    visibility: 不可见
    node: null
    must: false
    gap: "缺口:存量不公布,只能由收抛储公告推断"

# ══════════════════════════════════════════════════
# 非平衡表通道(L2/L3/L4)
# 有些根因不改变任何科目的量,而是改变"同样的量对应什么价格"。
# 它们不该被强行塞进平衡表,但必须显式声明走哪条通道,否则就是悬空根因。
# ══════════════════════════════════════════════════
channels:
  - id: 估值通道
    layer: L2
    meaning: "改变成本/利润结构,进而改变供给或需求的弹性"
    nodes: [TC/RC加工费, 冶炼利润, 硫酸价格, 精废价差]
    missing:
      - id: 矿山现金成本曲线
        gap: "★ 缺口:没有成本曲线就没有价格地板。'铜价跌到哪里会引发减产'这个问题目前无法回答"
      - id: 进口完税成本
        gap: "★ 缺口:LME × 汇率 × (1+关税)(1+增值税) + 到岸费。它 vs 沪铜价 = 进口盈亏,是沪伦比值的成本侧解释"
      - id: 铜铝比价
        gap: "缺口:电缆领域铝对铜的替代,高价环境下的需求破坏通道"

  - id: 结构通道
    layer: L3
    meaning: "改变现货与远期、区域与区域之间的相对松紧,不改变总量"
    nodes: [LME升水结构, COMEX-LME价差, 沪伦比值, 精废价差, LME注销仓单占比]
    missing:
      - id: 现货升贴水
        gap: "★ 缺口:日频最灵敏的国内松紧指标"
      - id: 洋山铜溢价
        gap: "★ 缺口:进口窗口的同步现货信号,已在多条边的 evidence 中被引用"
      - id: 海运费与套利门槛
        gap: "缺口(物流):区域价差必须扣除运费+资金+时间成本才是真实套利空间。铜的运费占货值 <3%,权重低于铁矿/煤,但在价差临界时决定搬库开关"

  - id: 预期通道
    layer: L4
    meaning: "改变同样基本面下的定价程度与赔率,不改变基本面本身"
    nodes: [基金净持仓]
    missing:
      - id: 一致预期分歧度
        gap: "缺口:机构平衡表预测的分歧程度。分歧大 = 有超额收益空间;高度一致 = 即使判断对也赚不到钱"

  - id: 计价转换通道
    layer: L0
    meaning: "不改变全球基本面,只改变全球价格到本地合约价格的转换关系"
    nodes: []
    missing:
      - id: 人民币汇率
        gap: "★★ 缺口:边「美元指数→LME铜价格」的 rationale 已明文写出汇率对冲机制,却没有节点。这是'机制写在文字里、没建成结构'的典型"
      - id: 可交割资源量
        gap: "★ 缺口:注册品牌 + 仓单可得性。总库存 ≠ 可交割库存"

# ══════════════════════════════════════════════════
# 定性残差诊断规则(不需要任何数字)
# ══════════════════════════════════════════════════
residual_rules:
  - id: 方向自洽
    rule: "若供给类科目整体判断为'松'且需求类科目整体为'弱',则库存科目必须为'累';反之为'去'。"
    violation: "推导方向与实测库存方向相反 → 要么某个科目判断反了,要么存在未建模科目在起作用"

  - id: 库存池闭合
    rule: "总库存方向变化,必须能被至少一个具体池子的变化解释。"
    violation: "说不出是哪一池在动 → 该池未建模(最常见的答案是:保税区、在途、厂内)"

  - id: 表观与真实背离
    rule: "表观消费(产量+净进口−显性库存变化)与终端行业加总的真实消费,长期背离方向即隐性库存方向。"
    violation: "背离持续且无解释 → 隐性库存在积累/释放,或口径有错(常见:漏了出口、漏了废铜直接利用)"

  - id: 结构证伪
    rule: "平衡表定性结论(紧/松) 应与 L3 结构指标(月差、现货升贴水、进口盈亏)同向。"
    violation: "结论说紧、但现货贴水走扩且月差转 contango,持续 4 周以上 → 平衡表判断需复核"
